name: Build GPS Monitor APK

on:
  push:
    paths:
      - 'apk-build/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
        timeout-minutes: 5

      - name: Initialize TWA project
        working-directory: ./apk-build
        env:
          BUBBLEWRAP_JDK: ${{ steps.setup-java.outputs.java-home }}
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "BUBBLEWRAP_JDK=$BUBBLEWRAP_JDK"
          bubblewrap init --manifest=manifest.json --non-interactive
        timeout-minutes: 10

      - name: Build APK
        working-directory: ./apk-build
        run: bubblewrap build --skipSigning
        timeout-minutes: 20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gps-monitor-apk
          path: apk-build/app-release.apk
          retention-days: 7
