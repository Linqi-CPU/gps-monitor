name: Build GPS Monitor APK

on:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'app/src/main/assets/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34

      - name: Install Build Tools
        run: yes | sdkmanager "build-tools;34.0.0"

      - name: Build APK with Gradle
        working-directory: .
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          gradle --version
          gradle clean
          gradle assembleDebug --stacktrace --info
          echo "=== APK output files ==="
          find app/build/outputs -name "*.apk" -type f 2>/dev/null || true
        timeout-minutes: 20

      - name: List APK outputs
        run: |
          ls -la app/build/outputs/apk/ || true
          ls -la app/build/outputs/apk/release/ || true
          ls -la app/build/outputs/apk/debug/ || true
        timeout-minutes: 5

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gps-monitor-apk
          path: app/build/outputs/apk/
