name: Build GPS Monitor APK

on:
  push:
    paths:
      - 'apk-build/**'
      - 'manifest.json'
      - 'config.xml'
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
        timeout-minutes: 5

      - name: Build APK
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq expect
          echo 'spawn bubblewrap init --manifest=manifest.json --non-interactive
          expect "Do you want Bubblewrap to install the JDK"
          send "n\r"
          expect "Path to your existing JDK 17"
          send "/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.20.1-1/x64\r"
          expect eof' > init.exp
          expect init.exp
          bubblewrap build --skipSigning
        timeout-minutes: 20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gps-monitor-apk
          path: apk-build/app-release.apk
          retention-days: 7
