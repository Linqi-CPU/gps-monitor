name: Build GPS Monitor APK

on:
  push:
    paths:
      - 'apk-build/**'
      - 'manifest.json'
      - 'config.xml'
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        run: |
          curl -fsSL https://github.com/adoptium/temurin17-binaries/releases/latest/download/OpenJDK17U-jdk_x64_linux_hotspot.tar.gz | tar xz
          echo "JDK_PATH=$(pwd)/jdk-17" >> $GITHUB_ENV
        timeout-minutes: 10

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
        timeout-minutes: 5

      - name: Build APK
        working-directory: .
        run: |
          echo "JDK_PATH=$JDK_PATH"
          echo 'spawn bubblewrap init --manifest=manifest.json --non-interactive
          expect "Do you want Bubblewrap to install the JDK"
          send "n\r"
          expect "Path to your existing JDK 17"
          send "$env(JDK_PATH)\r"
          expect eof' > init.exp
          expect init.exp
          bubblewrap build --skipSigning
        timeout-minutes: 20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gps-monitor-apk
          path: apk-build/app-release.apk
          retention-days: 7
