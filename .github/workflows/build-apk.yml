name: Build GPS Monitor APK

on:
  push:
    paths:
      - 'apk-build/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Initialize TWA project
        working-directory: ./apk-build
        run: |
          echo "n" | bubblewrap init --manifest=manifest.json --non-interactive

      - name: Build APK
        working-directory: ./apk-build
        run: bubblewrap build --skipSigning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gps-monitor-apk
          path: apk-build/app-release.apk
          retention-days: 7
